<svg viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"
     font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',system-ui,sans-serif">
  <title id="t">這個 repo 的結構：四個資料夾，要複製進專案的只有 core/starter/</title>
  <desc id="d">setup 是地基，裝 AI CLI 與設定檔。core 是主體，其中只有 core/starter/ 的內容要複製進你的專案。extras 全部選用，與 core 互不依賴。examples 只能看，不要複製。</desc>
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="rgba(45,49,66,0.05)" stroke-width="1"/></pattern><marker id="a-flow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#12996b"/></marker><marker id="a-ink" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#7b8494"/></marker><marker id="a-check" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#7a4ff0"/></marker><marker id="a-guard" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#e0355f"/></marker></defs>
  <rect width="1200" height="470" fill="#fafaf8"/>
  <rect width="1200" height="470" fill="url(#grid)"/>

  <!-- 區域 -->

  <!-- 連接線 -->
  <path d="M290,145 H330" fill="none" stroke="#12996b" stroke-width="2" marker-end="url(#a-flow)"/>
  <path d="M455,220 V280" fill="none" stroke="#12996b" stroke-width="2" marker-end="url(#a-flow)"/>
  <path d="M745,220 V290" fill="none" stroke="#7b8494" stroke-width="1.5" stroke-dasharray="5,4"/>
  <path d="M1035,220 V290" fill="none" stroke="#e0355f" stroke-width="1.5" stroke-dasharray="5,4"/>
  <path d="M165,220 V290" fill="none" stroke="#7b8494" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- 節點與文字 -->
  <rect x="40" y="70" width="250" height="150" rx="9" fill="#eceef2" stroke="#6b7384" stroke-width="1.3"/>
  <text x="165" y="108" fill="#23283a" font-size="19" font-weight="700" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono',Consolas,'Noto Sans TC','Microsoft JhengHei',monospace">setup/</text>
  <text x="165" y="136" fill="#23283a" font-size="13" font-weight="700" text-anchor="middle">地基</text>
  <text x="165" y="166" fill="#5d6675" font-size="12" font-weight="400" text-anchor="middle">Claude Code 或 Codex CLI</text>
  <text x="165" y="186" fill="#5d6675" font-size="12" font-weight="400" text-anchor="middle">Python 只有匯入與 PNG 才需要</text>
  <rect x="330" y="70" width="250" height="150" rx="9" fill="#dcf5ea" stroke="#12996b" stroke-width="1.8"/>
  <text x="455" y="108" fill="#23283a" font-size="19" font-weight="700" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono',Consolas,'Noto Sans TC','Microsoft JhengHei',monospace">core/</text>
  <text x="455" y="136" fill="#23283a" font-size="13" font-weight="700" text-anchor="middle">⭐ 主體：四份文件 ＋ 收工檢查</text>
  <text x="455" y="166" fill="#3d6b5a" font-size="12" font-weight="400" text-anchor="middle">安裝指南、分支與發佈</text>
  <text x="455" y="186" fill="#3d6b5a" font-size="12" font-weight="400" text-anchor="middle">交棒與封存、選配的美術指南</text>
  <rect x="620" y="70" width="250" height="150" rx="9" fill="#ffffff" stroke="#2d3142" stroke-width="1.3"/>
  <text x="745" y="108" fill="#23283a" font-size="19" font-weight="700" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono',Consolas,'Noto Sans TC','Microsoft JhengHei',monospace">extras/</text>
  <text x="745" y="136" fill="#23283a" font-size="13" font-weight="700" text-anchor="middle">選用：圖、簡報、編輯器外掛</text>
  <text x="745" y="166" fill="#5d6675" font-size="12" font-weight="400" text-anchor="middle">我個人的工作習慣</text>
  <text x="745" y="186" fill="#5d6675" font-size="12" font-weight="400" text-anchor="middle">挑你要的拿</text>
  <rect x="910" y="70" width="250" height="150" rx="9" fill="#eceef2" stroke="#6b7384" stroke-width="1.3"/>
  <text x="1035" y="108" fill="#23283a" font-size="19" font-weight="700" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono',Consolas,'Noto Sans TC','Microsoft JhengHei',monospace">examples/</text>
  <text x="1035" y="136" fill="#23283a" font-size="13" font-weight="700" text-anchor="middle">裝完長什麼樣</text>
  <text x="1035" y="166" fill="#5d6675" font-size="12" font-weight="400" text-anchor="middle">虛構的小功能：看格式怎麼填</text>
  <text x="1035" y="186" fill="#5d6675" font-size="12" font-weight="400" text-anchor="middle">這個 repo 自己：看真實的決策</text>
  <rect x="330" y="280" width="250" height="76" rx="7" fill="#fff1e0" stroke="#e0963a" stroke-width="1.5"/>
  <text x="455.0" y="306" fill="#23283a" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono',Consolas,'Noto Sans TC','Microsoft JhengHei',monospace">core/starter/</text>
  <text x="455.0" y="326" fill="#9a5a10" font-size="12" text-anchor="middle">只有這裡的「內容」</text>
  <text x="455.0" y="346" fill="#9a5a10" font-size="12" text-anchor="middle">要複製進你的專案</text>
  <rect x="620" y="290" width="250" height="56" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
  <text x="745.0" y="314" fill="#23283a" font-size="13.5" font-weight="700" text-anchor="middle">與 Core 互不依賴</text>
  <text x="745.0" y="335" fill="#5d6675" font-size="12" text-anchor="middle">不裝也完整運作</text>
  <rect x="910" y="290" width="250" height="56" rx="7" fill="#fde4ea" stroke="#e0355f" stroke-width="1.5"/>
  <text x="1035.0" y="314" fill="#23283a" font-size="13.5" font-weight="700" text-anchor="middle">只能看，不要複製</text>
  <text x="1035.0" y="335" fill="#a3294a" font-size="12" text-anchor="middle">複製了不會報錯，但內容是別人的</text>
  <rect x="40" y="290" width="250" height="56" rx="7" fill="#eceef2" stroke="#6b7384" stroke-width="1.5"/>
  <text x="165.0" y="314" fill="#23283a" font-size="13.5" font-weight="700" text-anchor="middle">真正必要的只有一個 AI CLI</text>
  <text x="165.0" y="335" fill="#5d6675" font-size="12" text-anchor="middle"></text>
  <line x1="40" y1="396" x2="1160" y2="396" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="40" y="424" fill="#8a909c" font-size="11.5">根目錄的 README.md 是手冊，只講「為什麼這樣設計」。有哪些檔、怎麼裝，寫在各資料夾自己的 README.md。</text>
  <text x="40" y="446" fill="#8a909c" font-size="11.5">.claude/ 與 .codex/ 刻意放在 core/starter/ 底下而不是根目錄，否則編輯這個 repo 時 hook 會自己叫起來擋你。</text>
</svg>
