<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"
     font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',system-ui,sans-serif">
  <title id="t">收工檢查怎麼判斷：觸發清單有異動、回填落點沒異動，就擋下</title>
  <desc id="d">每輪回答結束時觸發 Stop 事件，收工檢查讀 git status。觸發清單沒有異動就放行。有異動時再看 DEVLOG 與三個資料夾有沒有異動：有就放行，沒有就擋下並列出沒回填的檔，交給 doc-sync 回填後再收工。已經擋過一次、不是 git repo、腳本出錯這三種情況一律靜默放行。</desc>
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="rgba(45,49,66,0.05)" stroke-width="1"/></pattern><marker id="a-flow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#12996b"/></marker><marker id="a-ink" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#7b8494"/></marker><marker id="a-check" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#7a4ff0"/></marker><marker id="a-guard" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#e0355f"/></marker></defs>
  <rect width="1200" height="600" fill="#fafaf8"/>
  <rect width="1200" height="600" fill="url(#grid)"/>

  <!-- 區域 -->
  <rect x="250" y="440" width="680" height="110" rx="10" fill="rgba(45,49,66,0.03)" stroke="#7b8494" stroke-width="1.2" stroke-dasharray="7,5"/>
  <rect x="264" y="431" width="280" height="18" rx="3" fill="#fafaf8"/>
  <text x="272" y="445" fill="#5d6675" font-size="12" font-weight="600">例外：一律靜默放行，檢查工具壞掉不該卡住工作</text>

  <!-- 連接線 -->
  <path d="M190,144 H250" fill="none" stroke="#12996b" stroke-width="2" marker-end="url(#a-flow)"/>
  <path d="M420,144 H480" fill="none" stroke="#12996b" stroke-width="2" marker-end="url(#a-flow)"/>
  <path d="M670,144 H730" fill="none" stroke="#12996b" stroke-width="2" marker-end="url(#a-flow)"/>
  <rect x="688" y="120" width="24" height="20" rx="3" fill="#fafaf8"/>
  <text x="700" y="134" fill="#0d7a55" font-size="12" text-anchor="middle">有</text>
  <path d="M930,144 H1000" fill="none" stroke="#12996b" stroke-width="2" marker-end="url(#a-flow)"/>
  <rect x="953" y="120" width="24" height="20" rx="3" fill="#fafaf8"/>
  <text x="965" y="134" fill="#0d7a55" font-size="12" text-anchor="middle">有</text>
  <path d="M575,110 V68 Q575,60 583,60 H1072 Q1080,60 1080,68 V110" fill="none" stroke="#7b8494" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <rect x="762" y="51" width="132" height="20" rx="3" fill="#fafaf8"/>
  <text x="828" y="65" fill="#5d6675" font-size="12" text-anchor="middle">沒有異動，不需要回填</text>
  <path d="M830,178 V290" fill="none" stroke="#e0355f" stroke-width="1.5" marker-end="url(#a-guard)"/>
  <rect x="812" y="226" width="36" height="20" rx="3" fill="#fafaf8"/>
  <text x="830" y="240" fill="#c22a51" font-size="12" text-anchor="middle">沒有</text>
  <path d="M930,324 H1000" fill="none" stroke="#e0355f" stroke-width="1.5" marker-end="url(#a-guard)"/>
  <path d="M1080,290 V178" fill="none" stroke="#12996b" stroke-width="2" marker-end="url(#a-flow)"/>
  <rect x="1038" y="226" width="84" height="20" rx="3" fill="#fafaf8"/>
  <text x="1080" y="240" fill="#0d7a55" font-size="12" text-anchor="middle">回填完再收工</text>
  <path d="M335,178 V440" fill="none" stroke="#7b8494" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#a-ink)"/>
  <rect x="293" y="306" width="84" height="20" rx="3" fill="#fafaf8"/>
  <text x="335" y="320" fill="#5d6675" font-size="12" text-anchor="middle">檢查做不下去</text>

  <!-- 節點與文字 -->
  <rect x="40" y="110" width="150" height="68" rx="7" fill="#eceef2" stroke="#6b7384" stroke-width="1.5"/>
  <text x="115.0" y="141" fill="#23283a" font-size="15" font-weight="700" text-anchor="middle">一輪結束</text>
  <text x="115.0" y="162" fill="#5d6675" font-size="12" text-anchor="middle">Stop 事件</text>
  <rect x="250" y="110" width="170" height="68" rx="7" fill="#dcf5ea" stroke="#12996b" stroke-width="1.5"/>
  <text x="335.0" y="141" fill="#23283a" font-size="15" font-weight="700" text-anchor="middle">收工檢查啟動</text>
  <text x="335.0" y="162" fill="#3d6b5a" font-size="12" text-anchor="middle">讀 git status</text>
  <rect x="480" y="110" width="190" height="68" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
  <text x="575.0" y="141" fill="#23283a" font-size="15" font-weight="700" text-anchor="middle">觸發清單有異動？</text>
  <text x="575.0" y="162" fill="#5d6675" font-size="12" text-anchor="middle">程式、規格、README</text>
  <rect x="730" y="110" width="200" height="68" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
  <text x="830.0" y="141" fill="#23283a" font-size="15" font-weight="700" text-anchor="middle">回填落點有異動？</text>
  <text x="830.0" y="162" fill="#5d6675" font-size="12" text-anchor="middle">DEVLOG 與三個資料夾</text>
  <rect x="1000" y="110" width="160" height="68" rx="7" fill="#dcf5ea" stroke="#12996b" stroke-width="1.5"/>
  <text x="1080.0" y="141" fill="#23283a" font-size="15" font-weight="700" text-anchor="middle">放行收工</text>
  <text x="1080.0" y="162" fill="#3d6b5a" font-size="12" text-anchor="middle">這一輪可以結束</text>
  <rect x="730" y="290" width="200" height="68" rx="7" fill="#fde4ea" stroke="#e0355f" stroke-width="1.5"/>
  <text x="830.0" y="321" fill="#23283a" font-size="15" font-weight="700" text-anchor="middle">擋下</text>
  <text x="830.0" y="342" fill="#a3294a" font-size="12" text-anchor="middle">列出沒回填的檔</text>
  <rect x="1000" y="290" width="160" height="68" rx="7" fill="#dcf5ea" stroke="#12996b" stroke-width="1.5"/>
  <text x="1080.0" y="321" fill="#23283a" font-size="15" font-weight="700" text-anchor="middle">doc-sync</text>
  <text x="1080.0" y="342" fill="#3d6b5a" font-size="12" text-anchor="middle">先對規格，再回填</text>
  <rect x="270" y="470" width="200" height="56" rx="7" fill="#eceef2" stroke="#6b7384" stroke-width="1.5"/>
  <text x="370.0" y="504" fill="#23283a" font-size="13.5" font-weight="700" text-anchor="middle">這一輪已經擋過一次</text>
  <rect x="490" y="470" width="200" height="56" rx="7" fill="#eceef2" stroke="#6b7384" stroke-width="1.5"/>
  <text x="590.0" y="504" fill="#23283a" font-size="13.5" font-weight="700" text-anchor="middle">不是 git repo</text>
  <rect x="710" y="470" width="200" height="56" rx="7" fill="#eceef2" stroke="#6b7384" stroke-width="1.5"/>
  <text x="810.0" y="504" fill="#23283a" font-size="13.5" font-weight="700" text-anchor="middle">腳本自己出錯</text>
  <text x="40" y="580" fill="#8a909c" font-size="11.5">判斷只看「有沒有動」，讀不懂內容。實作有沒有牴觸規格要靠 doc-sync 判斷，所以擋下之後交給它。</text>
</svg>
