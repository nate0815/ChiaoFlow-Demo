<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"
     font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',system-ui,sans-serif">
  <title id="t">分支模型：兩條長命分支，其餘都是短命分支</title>
  <desc id="d">main 是開發主線，stable 是已發佈的內容。feat 與 fix 從 main 開出、合回 main。發佈時 main 以 no-ff 合進 stable 並打版本 tag。hotfix 從 stable 開出，一定要合回 stable 與 main 兩邊。demo 從 main 開出，只做減法與封裝，打完 tag 就刪，不合回任何地方。</desc>
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="rgba(45,49,66,0.05)" stroke-width="1"/></pattern><marker id="a-flow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#12996b"/></marker><marker id="a-ink" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#7b8494"/></marker><marker id="a-check" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#7a4ff0"/></marker><marker id="a-guard" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#e0355f"/></marker></defs>
  <rect width="1200" height="560" fill="#fafaf8"/>
  <rect width="1200" height="560" fill="url(#grid)"/>

  <!-- 區域 -->

  <!-- 連接線 -->
  <line x1="200" y1="110" x2="1140" y2="110" stroke="#7a4ff0" stroke-width="3"/>
  <line x1="200" y1="250" x2="1140" y2="250" stroke="#12996b" stroke-width="3"/>
  <path d="M250,250 V332 Q250,340 258,340 H402 Q410,340 410,332 V257" fill="none" stroke="#7b8494" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <path d="M520,250 V118" fill="none" stroke="#12996b" stroke-width="2" marker-end="url(#a-flow)"/>
  <rect x="456" y="202" width="128" height="20" rx="3" fill="#fafaf8"/>
  <text x="520" y="216" fill="#0d7a55" font-size="12" text-anchor="middle">發佈：--no-ff 合併</text>
  <path d="M640,110 V172 Q640,180 648,180 H772 Q780,180 780,172 V117" fill="none" stroke="#e0355f" stroke-width="1.5" marker-end="url(#a-guard)"/>
  <path d="M780,180 V243" fill="none" stroke="#e0355f" stroke-width="1.5" marker-end="url(#a-guard)"/>
  <rect x="822" y="170" width="96" height="20" rx="3" fill="#fafaf8"/>
  <text x="870" y="184" fill="#c22a51" font-size="12" text-anchor="middle">一定要合回兩邊</text>
  <path d="M930,250 V422 Q930,430 938,430 H1090" fill="none" stroke="#7b8494" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- 節點與文字 -->
  <text x="40" y="108" fill="#23283a" font-size="16" font-weight="700" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Consolas,'Noto Sans TC','Microsoft JhengHei',monospace">stable</text>
  <text x="40" y="127" fill="#5d6675" font-size="12" font-weight="400" text-anchor="start">已發佈的內容</text>
  <text x="40" y="248" fill="#23283a" font-size="16" font-weight="700" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Consolas,'Noto Sans TC','Microsoft JhengHei',monospace">main</text>
  <text x="40" y="267" fill="#5d6675" font-size="12" font-weight="400" text-anchor="start">主要開發分支</text>
  <text x="40" y="178" fill="#23283a" font-size="14" font-weight="700" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Consolas,'Noto Sans TC','Microsoft JhengHei',monospace">hotfix/*</text>
  <text x="40" y="197" fill="#5d6675" font-size="12" font-weight="400" text-anchor="start">已發佈版本的緊急修正</text>
  <text x="40" y="338" fill="#23283a" font-size="14" font-weight="700" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Consolas,'Noto Sans TC','Microsoft JhengHei',monospace">feat/* · fix/*</text>
  <text x="40" y="357" fill="#5d6675" font-size="12" font-weight="400" text-anchor="start">短命，合併後刪</text>
  <text x="40" y="428" fill="#23283a" font-size="14" font-weight="700" text-anchor="start" font-family="ui-monospace,'Cascadia Mono',Consolas,'Noto Sans TC','Microsoft JhengHei',monospace">demo/*</text>
  <text x="40" y="447" fill="#5d6675" font-size="12" font-weight="400" text-anchor="start">試玩版，一次性</text>
  <circle cx="300" cy="340" r="6" fill="#fafaf8" stroke="#7b8494" stroke-width="2.5"/>
  <circle cx="360" cy="340" r="6" fill="#fafaf8" stroke="#7b8494" stroke-width="2.5"/>
  <circle cx="250" cy="250" r="6" fill="#fafaf8" stroke="#12996b" stroke-width="2.5"/>
  <circle cx="410" cy="250" r="6" fill="#fafaf8" stroke="#12996b" stroke-width="2.5"/>
  <circle cx="520" cy="250" r="6" fill="#fafaf8" stroke="#12996b" stroke-width="2.5"/>
  <circle cx="520" cy="110" r="6" fill="#fafaf8" stroke="#7a4ff0" stroke-width="2.5"/>
  <rect x="494" y="76" width="52" height="20" rx="10" fill="#23283a"/>
  <text x="520" y="90" fill="#ffffff" font-size="11" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono',Consolas,'Noto Sans TC','Microsoft JhengHei',monospace">v0.3.1</text>
  <circle cx="710" cy="180" r="6" fill="#fafaf8" stroke="#e0355f" stroke-width="2.5"/>
  <circle cx="640" cy="110" r="6" fill="#fafaf8" stroke="#7a4ff0" stroke-width="2.5"/>
  <circle cx="780" cy="110" r="6" fill="#fafaf8" stroke="#7a4ff0" stroke-width="2.5"/>
  <circle cx="780" cy="250" r="6" fill="#fafaf8" stroke="#12996b" stroke-width="2.5"/>
  <rect x="754" y="76" width="52" height="20" rx="10" fill="#23283a"/>
  <text x="780" y="90" fill="#ffffff" font-size="11" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono',Consolas,'Noto Sans TC','Microsoft JhengHei',monospace">v0.3.2</text>
  <circle cx="930" cy="250" r="6" fill="#fafaf8" stroke="#12996b" stroke-width="2.5"/>
  <circle cx="990" cy="430" r="6" fill="#fafaf8" stroke="#7b8494" stroke-width="2.5"/>
  <circle cx="1090" cy="430" r="6" fill="#fafaf8" stroke="#7b8494" stroke-width="2.5"/>
  <rect x="1022" y="396" width="135" height="20" rx="10" fill="#23283a"/>
  <text x="1090" y="410" fill="#ffffff" font-size="11" text-anchor="middle" font-family="ui-monospace,'Cascadia Mono',Consolas,'Noto Sans TC','Microsoft JhengHei',monospace">demo-2026-09-taipei</text>
  <text x="1040" y="458" fill="#5d6675" font-size="12" font-weight="400" text-anchor="middle">只做減法與封裝，打完 tag 就刪，不合回任何地方</text>
  <text x="330" y="368" fill="#5d6675" font-size="12" font-weight="400" text-anchor="middle">新功能與一般修正</text>
  <line x1="40" y1="490" x2="1160" y2="490" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="40" y="516" fill="#8a909c" font-size="11.5">hotfix 只合進 stable 的話，下次發佈會把修正蓋回去，bug 原地復活，而且不會有任何東西報錯。</text>
  <text x="40" y="538" fill="#8a909c" font-size="11.5">兩套 tag 刻意不混用：正式版 v&lt;major&gt;.&lt;minor&gt;.&lt;patch&gt; 打在 stable；試玩版 demo-&lt;年月&gt;-&lt;場次&gt; 打在 demo 分支的最後一個 commit。</text>
</svg>
