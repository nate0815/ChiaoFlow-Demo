<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"
     font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',system-ui,sans-serif">
  <title id="t">與 DESIGN 不一致時怎麼分流：誰牴觸，決定要不要停下來問</title>
  <desc id="d">程式或實作與 DESIGN 牴觸時停下來升報，由主事者三選一：改程式、授權改 DESIGN、或列入待決。PLAN、TECH、README 與 DESIGN 牴觸時直接改它們對齊，並在回報裡列出改了哪幾處。DESIGN 自己要改時一定要主事者點頭，並在版本紀錄寫明改了什麼與為什麼。</desc>
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="rgba(45,49,66,0.05)" stroke-width="1"/></pattern><marker id="a-flow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#12996b"/></marker><marker id="a-ink" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#7b8494"/></marker><marker id="a-check" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#7a4ff0"/></marker><marker id="a-guard" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#e0355f"/></marker></defs>
  <rect width="1200" height="560" fill="#fafaf8"/>
  <rect width="1200" height="560" fill="url(#grid)"/>

  <!-- 區域 -->

  <!-- 連接線 -->
  <path d="M240,248 H277 Q285,248 285,240 V100 Q285,92 293,92 H330" fill="none" stroke="#7b8494" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <path d="M240,260 H330" fill="none" stroke="#7b8494" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <path d="M240,272 H277 Q285,272 285,280 V420 Q285,428 293,428 H330" fill="none" stroke="#7b8494" stroke-width="1.5" marker-end="url(#a-ink)"/>
  <path d="M560,92 H650" fill="none" stroke="#e0355f" stroke-width="1.5" marker-end="url(#a-guard)"/>
  <path d="M880,92 H960" fill="none" stroke="#e0355f" stroke-width="1.5" marker-end="url(#a-guard)"/>
  <path d="M560,260 H650" fill="none" stroke="#12996b" stroke-width="2" marker-end="url(#a-flow)"/>
  <path d="M880,260 H960" fill="none" stroke="#12996b" stroke-width="2" marker-end="url(#a-flow)"/>
  <path d="M560,428 H650" fill="none" stroke="#e0355f" stroke-width="1.5" marker-end="url(#a-guard)"/>
  <path d="M880,428 H960" fill="none" stroke="#e0355f" stroke-width="1.5" marker-end="url(#a-guard)"/>

  <!-- 節點與文字 -->
  <rect x="40" y="226" width="200" height="68" rx="7" fill="#fde4ea" stroke="#e0355f" stroke-width="1.5"/>
  <text x="140.0" y="257" fill="#23283a" font-size="14.5" font-weight="700" text-anchor="middle">發現與 DESIGN 不一致</text>
  <text x="140.0" y="278" fill="#a3294a" font-size="12" text-anchor="middle">預設是「那邊錯了」</text>
  <rect x="330" y="58" width="230" height="68" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
  <text x="445.0" y="89" fill="#23283a" font-size="15" font-weight="700" text-anchor="middle">程式／實作</text>
  <text x="445.0" y="110" fill="#5d6675" font-size="12" text-anchor="middle">跟規格寫的不一樣</text>
  <rect x="330" y="226" width="230" height="68" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
  <text x="445.0" y="257" fill="#23283a" font-size="15" font-weight="700" text-anchor="middle">PLAN · TECH · README</text>
  <text x="445.0" y="278" fill="#5d6675" font-size="12" text-anchor="middle">其他文件寫的不一樣</text>
  <rect x="330" y="394" width="230" height="68" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
  <text x="445.0" y="425" fill="#23283a" font-size="15" font-weight="700" text-anchor="middle">DESIGN 自己要改</text>
  <text x="445.0" y="446" fill="#5d6675" font-size="12" text-anchor="middle">規格本身需要更新</text>
  <rect x="650" y="58" width="230" height="68" rx="7" fill="#fde4ea" stroke="#e0355f" stroke-width="1.5"/>
  <text x="765.0" y="89" fill="#23283a" font-size="15" font-weight="700" text-anchor="middle">停下來升報</text>
  <text x="765.0" y="110" fill="#a3294a" font-size="12" text-anchor="middle">規格怎麼寫／實作怎樣／出處行號</text>
  <rect x="650" y="226" width="230" height="68" rx="7" fill="#dcf5ea" stroke="#12996b" stroke-width="1.5"/>
  <text x="765.0" y="257" fill="#23283a" font-size="15" font-weight="700" text-anchor="middle">直接改它們對齊</text>
  <text x="765.0" y="278" fill="#3d6b5a" font-size="12" text-anchor="middle">不用問</text>
  <rect x="650" y="394" width="230" height="68" rx="7" fill="#fde4ea" stroke="#e0355f" stroke-width="1.5"/>
  <text x="765.0" y="425" fill="#23283a" font-size="15" font-weight="700" text-anchor="middle">主事者點頭才能改</text>
  <text x="765.0" y="446" fill="#a3294a" font-size="12" text-anchor="middle">確認框或解鎖檔</text>
  <rect x="960" y="46" width="200" height="92" rx="7" fill="#eceef2" stroke="#6b7384" stroke-width="1.5"/>
  <text x="1060.0" y="80" fill="#23283a" font-size="15" font-weight="700" text-anchor="middle">主事者三選一</text>
  <text x="1060.0" y="100" fill="#5d6675" font-size="12" text-anchor="middle">改程式 · 授權改 DESIGN</text>
  <text x="1060.0" y="120" fill="#5d6675" font-size="12" text-anchor="middle">或列入待決問題</text>
  <rect x="960" y="226" width="200" height="68" rx="7" fill="#ece6fd" stroke="#7a4ff0" stroke-width="1.5"/>
  <text x="1060.0" y="257" fill="#23283a" font-size="15" font-weight="700" text-anchor="middle">收工回報</text>
  <text x="1060.0" y="278" fill="#5a45a0" font-size="12" text-anchor="middle">列出改了哪幾處</text>
  <rect x="960" y="394" width="200" height="68" rx="7" fill="#ece6fd" stroke="#7a4ff0" stroke-width="1.5"/>
  <text x="1060.0" y="425" fill="#23283a" font-size="15" font-weight="700" text-anchor="middle">版本紀錄加一列</text>
  <text x="1060.0" y="446" fill="#5a45a0" font-size="12" text-anchor="middle">改了什麼＋為什麼</text>
  <line x1="40" y1="500" x2="1160" y2="500" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <rect x="40" y="522" width="18" height="12" rx="3" fill="#fde4ea" stroke="#e0355f" stroke-width="1.3"/>
  <text x="66" y="533" fill="#5d6675" font-size="12">要人裁決</text>
  <rect x="144" y="522" width="18" height="12" rx="3" fill="#dcf5ea" stroke="#12996b" stroke-width="1.3"/>
  <text x="170" y="533" fill="#5d6675" font-size="12">AI 可以自己做</text>
  <rect x="280.88" y="522" width="18" height="12" rx="3" fill="#ece6fd" stroke="#7a4ff0" stroke-width="1.3"/>
  <text x="306.88" y="533" fill="#5d6675" font-size="12">要留下紀錄</text>
  <rect x="396.88" y="522" width="18" height="12" rx="3" fill="#eceef2" stroke="#6b7384" stroke-width="1.3"/>
  <text x="422.88" y="533" fill="#5d6675" font-size="12">人的決定</text>
</svg>
