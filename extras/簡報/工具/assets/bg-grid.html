<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
  html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden}
  .s{position:relative;width:1920px;height:1080px;background:#f5f5f5}
  /* 製圖網格 48px —— 跟 HTML 版同一個值 */
  .s::before{content:'';position:absolute;inset:0;
    background:
      repeating-linear-gradient(90deg,rgba(45,49,66,.045) 0 1px,transparent 1px 48px),
      repeating-linear-gradient(180deg,rgba(45,49,66,.045) 0 1px,transparent 1px 48px);}
  .reg{position:absolute;width:30px;height:30px;opacity:.45}
  .reg::before,.reg::after{content:'';position:absolute;background:#7a8399}
  .reg::before{left:0;right:0;top:50%;height:1px}
  .reg::after{top:0;bottom:0;left:50%;width:1px}
  .tl{left:44px;top:44px}.tr{right:44px;top:44px}.bl{left:44px;bottom:44px}.br{right:44px;bottom:44px}
</style></head>
<body><div class="s">
  <i class="reg tl"></i><i class="reg tr"></i><i class="reg bl"></i><i class="reg br"></i>
</div></body></html>
