<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"
     font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',system-ui,sans-serif">
  <title id="t">Extras 的分界：這份東西是還要繼續改的原始碼，還是要交出去的產出物</title>
  <desc id="d">給 AI 讀的正本是純文字、進版控，包含四份文件與 Mermaid 原始碼。給人看的產出物是一次性的，包含正式圖與簡報。產出物由正本產生，但永遠不能回頭當正本。</desc>
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="rgba(45,49,66,0.05)" stroke-width="1"/></pattern><marker id="a-flow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#12996b"/></marker><marker id="a-ink" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#7b8494"/></marker><marker id="a-check" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#7a4ff0"/></marker><marker id="a-guard" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#e0355f"/></marker></defs>
  <rect width="1200" height="480" fill="#fafaf8"/>
  <rect width="1200" height="480" fill="url(#grid)"/>

  <!-- 區域 -->
  <rect x="40" y="80" width="500" height="270" rx="10" fill="rgba(240,150,40,0.045)" stroke="#e0963a" stroke-width="1.2" stroke-dasharray="7,5"/>
  <rect x="54" y="71" width="209" height="18" rx="3" fill="#fafaf8"/>
  <text x="62" y="85" fill="#b86a12" font-size="12" font-weight="600">給 AI 讀的正本 · 純文字，進版控</text>
  <rect x="660" y="80" width="500" height="270" rx="10" fill="rgba(45,49,66,0.03)" stroke="#7b8494" stroke-width="1.2" stroke-dasharray="7,5"/>
  <rect x="674" y="71" width="157" height="18" rx="3" fill="#fafaf8"/>
  <text x="682" y="85" fill="#5d6675" font-size="12" font-weight="600">給人看的產出物 · 一次性</text>

  <!-- 連接線 -->
  <path d="M510,160 H690" fill="none" stroke="#12996b" stroke-width="2" marker-end="url(#a-flow)"/>
  <rect x="582" y="136" width="36" height="20" rx="3" fill="#fafaf8"/>
  <text x="600" y="150" fill="#0d7a55" font-size="12" text-anchor="middle">產生</text>
  <path d="M510,275 H690" fill="none" stroke="#12996b" stroke-width="2" marker-end="url(#a-flow)"/>
  <rect x="582" y="251" width="36" height="20" rx="3" fill="#fafaf8"/>
  <text x="600" y="265" fill="#0d7a55" font-size="12" text-anchor="middle">產生</text>

  <!-- 節點與文字 -->
  <rect x="70" y="115" width="440" height="90" rx="7" fill="#ece6fd" stroke="#7a4ff0" stroke-width="1.5"/>
  <text x="290.0" y="148" fill="#23283a" font-size="15" font-weight="700" text-anchor="middle">四份文件</text>
  <text x="290.0" y="168" fill="#5a45a0" font-size="12" text-anchor="middle">DESIGN · PLAN · TECH · DEVLOG</text>
  <text x="290.0" y="188" fill="#5a45a0" font-size="12" text-anchor="middle">diff 得出來、grep 找得到</text>
  <rect x="70" y="230" width="440" height="90" rx="7" fill="#ece6fd" stroke="#7a4ff0" stroke-width="1.5"/>
  <text x="290.0" y="262" fill="#23283a" font-size="15" font-weight="700" text-anchor="middle">Mermaid 原始碼</text>
  <text x="290.0" y="284" fill="#5a45a0" font-size="12" text-anchor="middle">還要繼續改的圖</text>
  <text x="290.0" y="302" fill="#5a45a0" font-size="12" text-anchor="middle">留純文字，不要全面換成圖片</text>
  <rect x="690" y="115" width="440" height="90" rx="7" fill="#eceef2" stroke="#6b7384" stroke-width="1.5"/>
  <text x="910.0" y="148" fill="#23283a" font-size="15" font-weight="700" text-anchor="middle">正式圖</text>
  <text x="910.0" y="168" fill="#5d6675" font-size="12" text-anchor="middle">PNG · SVG，貼進簡報或文件</text>
  <text x="910.0" y="188" fill="#5d6675" font-size="12" text-anchor="middle">交出去就結束</text>
  <rect x="690" y="230" width="440" height="90" rx="7" fill="#eceef2" stroke="#6b7384" stroke-width="1.5"/>
  <text x="910.0" y="262" fill="#23283a" font-size="15" font-weight="700" text-anchor="middle">簡報</text>
  <text x="910.0" y="284" fill="#5d6675" font-size="12" text-anchor="middle">pptx · HTML</text>
  <text x="910.0" y="302" fill="#5d6675" font-size="12" text-anchor="middle">做完就結束，沒有自動化裝置</text>
  <rect x="400" y="380" width="400" height="50" rx="7" fill="#fde4ea" stroke="#e0355f" stroke-width="1.5"/>
  <text x="600.0" y="411" fill="#23283a" font-size="14.5" font-weight="700" text-anchor="middle">產出物永遠不能當正本</text>
  <text x="40" y="460" fill="#8a909c" font-size="11.5">一條判準：關掉軟體、用記事本打開那個檔。看不到的東西，AI 也看不到。</text>
</svg>
